name: Build macOS App

on:
  # Manual: Actions -> Build macOS App -> Run workflow, on any branch.
  workflow_dispatch:
  # Automatic: every tag that starts with v, e.g. v0.2.0. Work in progress does not
  # build; a tagged version always does, and the DMG is tied to that exact commit.
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Download my project
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Determine version
        id: version
        run: |
          # A tagged build is named after the tag; anything else after its commit, so
          # every DMG can be traced back to the exact source it was built from.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          printf '%s' "$VERSION" > version.txt
          echo "Building version $VERSION"

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the Mac app
        run: |
          pyinstaller --windowed --name="Cocoon Annotation Tool" \
            --add-data="configs:configs" \
            --add-data="version.txt:." \
            --add-data="models/bee_cocoon_stardist/config.json:models/bee_cocoon_stardist" \
            --add-data="models/bee_cocoon_stardist/weights_best.h5:models/bee_cocoon_stardist" \
            main.py

      - name: Stamp the version into the app bundle
        run: |
          # So Finder's Get Info and the About panel show the build, not 0.0.0.
          # Apple wants digits here, so a leading "v" is dropped; a commit SHA is
          # passed through as-is, which Finder displays without complaint.
          PLIST="dist/Cocoon Annotation Tool.app/Contents/Info.plist"
          VERSION="${{ steps.version.outputs.version }}"
          VERSION="${VERSION#v}"
          for KEY in CFBundleShortVersionString CFBundleVersion; do
            /usr/libexec/PlistBuddy -c "Set :$KEY $VERSION" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :$KEY string $VERSION" "$PLIST"
          done
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"

          # PyInstaller ad-hoc signs the bundle and that signature seals Info.plist, so
          # editing the plist invalidates it and macOS refuses to launch the app with
          # "the application is damaged". Re-sign after stamping.
          codesign --force --deep --sign - "dist/Cocoon Annotation Tool.app"
          codesign --verify --deep --strict "dist/Cocoon Annotation Tool.app"
          echo "signature valid after stamping"

      - name: Install brew
        run: |
          brew install create-dmg
          
      - name: Prepare DMG folder
        run: |
          mkdir -p dist/dmg
          rm -rf dist/dmg/*
          cp -R "dist/Cocoon Annotation Tool.app" dist/dmg/

      - name: Create macOS Disk Image
        run: |
          rm -f "dist/CocoonAnnotationTool-${{ steps.version.outputs.version }}.dmg"

          create-dmg \
            --volname "Cocoon Annotation Tool" \
            --window-pos 200 120 \
            --window-size 600 300 \
            --hide-extension "Cocoon Annotation Tool.app" \
            --app-drop-link 425 120 \
            "dist/CocoonAnnotationTool-${{ steps.version.outputs.version }}.dmg" \
            "dist/dmg/" || true

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: CocoonAnnotationTool-${{ steps.version.outputs.version }}
          path: dist/CocoonAnnotationTool-${{ steps.version.outputs.version }}.dmg
          retention-days: 14
