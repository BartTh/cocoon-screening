name: Build macOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Download my project
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the Mac app
        run: |
          pyinstaller --windowed --name="Cocoon Annotation Tool" \
            --add-data="configs:configs" \
            --add-data="models/bee_cocoon_stardist/config.json:models/bee_cocoon_stardist" \
            --add-data="models/bee_cocoon_stardist/weights_best.h5:models/bee_cocoon_stardist" \
            main.py

      - name: Install brew
        run: |
          brew install create-dmg
          
      - name: Prepare DMG folder
        run: |
          mkdir -p dist/dmg
          rm -rf dist/dmg/*
          cp -R "dist/Cocoon Annotation Tool.app" dist/dmg/

      - name: Create macOS Disk Image
        run: |
          rm -f "dist/Cocoon Annotation Tool.dmg"

          create-dmg \
            --volname "Cocoon Annotation Tool" \
            --window-pos 200 120 \
            --window-size 600 300 \
            --hide-extension "Cocoon Annotation Tool.app" \
            --app-drop-link 425 120 \
            "dist/Cocoon Annotation Tool.dmg" \
            "dist/dmg/" || true

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: CocoonAnnotationTool
          path: dist/CocoonAnnotationTool.dmg
          retention-days: 1
