name: Build macOS App

on:
  # Manual: Actions -> Build macOS App -> Run workflow, on any branch.
  workflow_dispatch:
  # Automatic: every tag that starts with v, e.g. v0.2.0. Work in progress does not
  # build; a tagged version always does, and the DMG is tied to that exact commit.
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Download my project
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Determine version
        id: version
        run: |
          # A tagged build is named after the tag; anything else after its commit, so
          # every DMG can be traced back to the exact source it was built from.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          printf '%s' "$VERSION" > version.txt
          echo "Building version $VERSION"

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the Mac app
        run: |
          # CocoonAnnotationTool.spec carries the data files, the exclude list and the
          # version in Info.plist, so nothing has to be patched into the bundle afterwards.
          pyinstaller --noconfirm CocoonAnnotationTool.spec

      - name: Check the bundle
        run: |
          APP="dist/Cocoon Annotation Tool.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          # The spec sets the version before PyInstaller signs, so the ad-hoc signature
          # still matches. Verify it: an invalid signature makes macOS report the app as
          # "damaged", which is how v0.3.0 shipped broken.
          codesign --verify --deep --strict "$APP" && echo "signature valid"
          echo "bundle size: $(du -sh "$APP" | cut -f1)"
          du -sh "$APP"/Contents/Frameworks/* 2>/dev/null | sort -rh | head -15

      - name: Install brew
        run: |
          brew install create-dmg
          
      - name: Prepare DMG folder
        run: |
          mkdir -p dist/dmg
          rm -rf dist/dmg/*
          cp -R "dist/Cocoon Annotation Tool.app" dist/dmg/

      - name: Create macOS Disk Image
        run: |
          rm -f "dist/CocoonAnnotationTool-${{ steps.version.outputs.version }}.dmg"

          create-dmg \
            --volname "Cocoon Annotation Tool" \
            --window-pos 200 120 \
            --window-size 600 300 \
            --hide-extension "Cocoon Annotation Tool.app" \
            --app-drop-link 425 120 \
            "dist/CocoonAnnotationTool-${{ steps.version.outputs.version }}.dmg" \
            "dist/dmg/" || true

      - name: Report sizes
        run: |
          echo "app:  $(du -sh "dist/Cocoon Annotation Tool.app" | cut -f1)"
          echo "dmg:  $(du -sh dist/CocoonAnnotationTool-${{ steps.version.outputs.version }}.dmg | cut -f1)"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: CocoonAnnotationTool-${{ steps.version.outputs.version }}
          path: dist/CocoonAnnotationTool-${{ steps.version.outputs.version }}.dmg
          retention-days: 14
