name: Build macOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Download my project
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the Mac app
        run: |
          pyinstaller --windowed --name CocoonAnnotationTool \
            --add-data "configs:configs" \
            --add-data "models/bee_cocoon_stardist/config.json:models/bee_cocoon_stardist" \
            --add-data "models/bee_cocoon_stardist/weights_best.h5:models/bee_cocoon_stardist" \
            main.py

      - name: Zip the app
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/CocoonAnnotationTool.app CocoonAnnotationTool-macOS.zip

      - name: Save the finished app
        uses: actions/upload-artifact@v4
        with:
          name: CocoonAnnotationTool-macOS
          path: CocoonAnnotationTool-macOS.zip
